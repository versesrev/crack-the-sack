<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crack the Sack</title>
<style>
  body {
    margin: 2vh 4vw;
    font-family: sans-serif;
  }

        #container {
  display: flex;
  height: calc(100vh - 12em); /* Keep enough space below */
  overflow: hidden;
  border: 1px solid #ccc;
}

#lineNumbers {
  width: 2.5em;
  text-align: right;
  padding-right: 0.5em;
  font-family: monospace;
  font-size: 1em;
  line-height: 1.5em;
  background-color: #f0f0f0;
  user-select: none;
  overflow: hidden;
  overflow-y: hidden;
}

#userInput {
  flex: 1;
  height: 100%;
  resize: none;
  font-family: monospace;
  font-size: 1em;
  line-height: 1.5em;
  box-sizing: border-box;
  overflow-y: scroll;
}


  #submitButton {
    margin-top: 1em;
    padding: 0.5em 1em;
    font-size: 1em;
  }

  #outputArea {
    min-height: 4.5em; /* Enough for 3 lines */
    margin-top: 1em;
    padding: 0.5em;
    border: 1px solid #ccc;
    background-color: #f8f8f8;
    white-space: pre-wrap;
  }
</style>

</head>
<body>
  <div id="container">
    <div id="lineNumbers"></div>
    <textarea id="userInput" placeholder="Enter your input here..."></textarea>
  </div>
  <button id="submitButton">Submit</button>
  <div id="outputArea"></div>


  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
<script>
        console.log("Script loaded");
        console.log(document.getElementById("submitButton"));


  window.addEventListener('DOMContentLoaded', async () => {
    const textarea = document.getElementById('userInput');
    const lineNumbers = document.getElementById('lineNumbers');
    const submitButton = document.getElementById('submitButton');
    const outputArea = document.getElementById('outputArea');

    // Pyodide initialization
    let pyodide = await loadPyodide();

    // Update line numbers on input
    function updateLineNumbers() {
      const lines = textarea.value.split('\n').length || 1;
      lineNumbers.innerHTML = '';
      for (let i = 1; i <= lines; i++) {
        const lineDiv = document.createElement('div');
        lineDiv.textContent = i;
        lineNumbers.appendChild(lineDiv);
      }
    }

    function syncScroll() {
      lineNumbers.scrollTop = textarea.scrollTop;
    }

    textarea.addEventListener('input', updateLineNumbers);
    textarea.addEventListener('scroll', syncScroll);

    updateLineNumbers();
    syncScroll();

    submitButton.addEventListener('click', async () => {
        console.log("Button clicked");
        console.log(document.getElementById("submitButton"));


      const input = textarea.value.slice(0, 100);

      // Indicate loading
      submitButton.disabled = true;
      submitButton.textContent = 'Processing...';
      outputArea.textContent = 'Running algorithm, please wait...';

    // Force a render before continuing
    await new Promise(requestAnimationFrame);

      // Python algorithm
      const code = `
def compute(text):
    W = 0
    w = []
    v = []
    output = []

    input_length = 0
    lines = text.strip().splitlines()

    if not lines:
        return "No input"

    for i, line in enumerate(lines):
        line = line.strip()
        input_length += len(line) + 1
        if i == 0:
            W = int(line)
            if W <= 0:
                return "Incorrect data: Non-positive weight"
        else:
            parts = line.split()
            if len(parts) != 2:
                return "Incorrect data: Invalid line format"
            cw, cv = [int(t) for t in parts]
            if cw <= 0 or cv <= 0:
                return "Incorrect data: Non-positive capacity or weight"
            w.append(cw)
            v.append(cv)

    if input_length > 100:
        return "Incorrect data: Input length exceeds 100"

    N = len(w)

    def should_swap(l, r):
        if v[l] * w[r] < v[r] * w[l]:
            return True
        if v[l] * w[r] == v[r] * w[l] and w[l] < w[r]:
            return True
        return False

    for i in range(1, N):
        while i > 0 and should_swap(i - 1, i):
            w[i], w[i - 1] = w[i - 1], w[i]
            v[i], v[i - 1] = v[i - 1], v[i]
            i -= 1

    gw = 0
    gv = 0
    b = 0
    while b < N and gw + w[b] <= W:
        gw += w[b]
        gv += v[b]
        b += 1

    if b == N:
        output.append("Cost: 0")
        output.append("Points earned: 0.0")
        return '\\n'.join(output)

    best_v = gv
    cost = 0

    for i in range(b + 1, N):
        if gw + w[i] <= W:
            best_v = max(best_v, gv + v[i])

    for i in range(0, b):
        if gw + w[b] - w[i] <= W:
            best_v = max(best_v, gv + v[b] - v[i])

    prev = [N if i == 0 else i - 1 for i in range(N + 1)]
    next = [0 if i == N else i + 1 for i in range(N + 1)]

    def remove(i):
        next[prev[i]] = next[i]
        prev[next[i]] = prev[i]

    def go(sw, sv, left, right):
        nonlocal cost, best_v
        cost += 1
        if sw <= W:
            if sv > best_v:
                best_v = sv
            while right != N:
                if (best_v + 1 - gv - v[right]) * w[b] > (W - gw - w[right]) * v[b]:
                    old = right
                    right = next[right]
                    remove(old)
                    continue
                if (sv - best_v - 1) * w[right] < (sw - W) * v[right]:
                    return
                go(sw + w[right], sv + v[right], left, next[right])
                right = next[right]
        else:
            while left != N:
                if (best_v + 1 - gv + v[left]) * w[b] > (W - gw + w[left]) * v[b]:
                    old = left
                    left = prev[left]
                    remove(old)
                    continue
                if (sv - best_v - 1) * w[left] < (sw - W) * v[left]:
                    return
                go(sw - w[left], sv - v[left], prev[left], right)
                left = prev[left]

    go(gw, gv, b - 1, b)
    output.append("best_v: " + str(best_v))
    output.append("Cost: " + str(cost))
    output.append("Points earned: " + str(cost * 1e-3))
    return '\\n'.join(output)

compute("""${input.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}""")
`;

      try {
        const result = await pyodide.runPythonAsync(code);
        outputArea.textContent = "Result:\n" + result;
      } catch (err) {
        outputArea.textContent = "Error:\n" + err;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Submit';
      }
    });
  });
</script>

</body>
</html>
